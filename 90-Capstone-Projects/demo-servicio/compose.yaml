services:
  servicio:
    build:
      context: .
    image: demo-servicio:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
