name: Build interactive DevOps learning site

on:
  push:
    branches:
      - features
    paths:
      - "**.md"
      - "scripts/build_learning_site.py"
      - "web-lessons/**"
      - ".github/workflows/linux-permissions-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-learning-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Markdown renderer
        run: python3 -m pip install --disable-pip-version-check Markdown
      - name: Build the full curriculum
        run: python3 scripts/build_learning_site.py
      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/web-lessons/linux-permissions/index.html
          test -s site/web-lessons/linux-filesystems/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          pages = list(Path("site").rglob("index.html"))
          assert len(pages) >= 90, f"Too few generated pages: {len(pages)}"
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if "id" in a: self.ids.append(a["id"])
                  if a.get("href","").startswith("#"): self.links.append(a["href"][1:])
          for page in pages:
              source=page.read_text(encoding="utf-8")
              assert '<html lang="ru">' in source, f"Missing Russian locale: {page}"
              checker=Check(); checker.feed(source)
              duplicates=sorted({x for x in checker.ids if checker.ids.count(x)>1})
              assert not duplicates, f"Duplicate IDs in {page}: {duplicates}"
              missing=sorted(set(checker.links)-set(checker.ids))
              assert not missing, f"Broken local anchors in {page}: {missing}"
          print(f"Validated {len(pages)} generated pages.")
          PY
          node --check web-lessons/assets/course.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
