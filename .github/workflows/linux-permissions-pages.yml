name: Publish Linux permissions lesson to GitHub Pages

on:
  push:
    branches:
      - features
    paths:
      - "web-lessons/linux-permissions/**"
      - "02-Linux/README.md"
      - ".github/workflows/linux-permissions-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-linux-permissions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML structure and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s web-lessons/linux-permissions/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("web-lessons/linux-permissions/index.html").read_text(encoding="utf-8")
          assert '<html lang="ru">' in source, "Страница должна указывать русский язык"
          assert 'id="chmod"' in source and 'id="quiz"' in source, "Не найдены обязательные интерактивные разделы"
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          assert scripts, "Не найден встроенный JavaScript"
          Path("/tmp/linux-permissions.js").write_text("\n".join(scripts), encoding="utf-8")

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.anchors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  href = attrs.get("href", "")
                  if href.startswith("#"):
                      self.anchors.append(href[1:])

          checker = Checker()
          checker.feed(source)
          duplicates = sorted({x for x in checker.ids if checker.ids.count(x) > 1})
          assert not duplicates, f"Повторяющиеся id: {duplicates}"
          missing = sorted(set(checker.anchors) - set(checker.ids))
          assert not missing, f"Ссылки ведут на отсутствующие разделы: {missing}"
          print(f"HTML sanity check passed: {len(checker.ids)} IDs, {len(checker.anchors)} internal links.")
          PY
          node --check /tmp/linux-permissions.js
      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/web-lessons/linux-permissions
          cp web-lessons/linux-permissions/index.html site/index.html
          cp web-lessons/linux-permissions/index.html site/web-lessons/linux-permissions/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload lesson artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
