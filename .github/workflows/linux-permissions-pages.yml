name: Publish Linux permissions lesson to GitHub Pages

on:
  push:
    branches:
      - features
    paths:
      - "web-lessons/linux-permissions/**"
      - ".github/workflows/linux-permissions-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-linux-permissions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate lesson files
        run: |
          test -s web-lessons/linux-permissions/index.html
          grep -q '<html lang="ru">' web-lessons/linux-permissions/index.html
          grep -q 'id="chmod"' web-lessons/linux-permissions/index.html
          grep -q 'id="quiz"' web-lessons/linux-permissions/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload lesson artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-lessons/linux-permissions
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
